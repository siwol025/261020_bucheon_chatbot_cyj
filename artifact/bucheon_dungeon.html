<title>부천 던전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 칸짜리 세로 열. 위에 지하철 노선 표지판 같은 HUD, 아래로 이야기 로그가 쌓이고 맨 아래에 행동 입력. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --ink: #16201a;
  --muted: #5a695f;
  --line: #d2d9d1;
  --accent: #5a6300;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --font-display: "Do Hyeon", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161e19; --ink: #e6ece7; --muted: #97a69c;
    --line: #2a362e; --accent: #aab31a; --accent-ink: #10140a; --danger: #ff7a6e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161e19; --ink: #e6ece7; --muted: #97a69c;
  --line: #2a362e; --accent: #aab31a; --accent-ink: #10140a; --danger: #ff7a6e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.7 var(--font-body);
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; position: relative; z-index: 1; }

/* 연출 레이어: 장소 색조(glow)와 피격/회복 번쩍임(flash) */
#glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 90% 55% at 50% -5%, hsl(var(--hue, 90) 65% 50% / .2), transparent 72%); }
#flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
.cursor::after { content: "▍"; color: var(--accent); margin-left: 1px; }

/* 노선 표지판 */
.sign { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.badge {
  flex: none; width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font: 700 22px/1 var(--font-mono);
}
h1 { margin: 0; font: 400 clamp(28px, 6vw, 38px)/1.1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }

/* HUD: 스크롤해도 상단에 고정 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.hud {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5;
  box-shadow: 0 6px 12px -8px rgba(0, 0, 0, .35);
  display: grid; gap: 10px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.hp { display: flex; align-items: center; gap: 12px; font: 700 13px/1 var(--font-mono); }
.hp-label { color: var(--muted); letter-spacing: .08em; }
.cells { display: flex; gap: 3px; flex: 1; min-width: 0; }
.cell { height: 12px; flex: 1; border-radius: 2px; background: var(--line); transition: background .3s; }
.cell.on { background: var(--accent); }
.hud[data-low="true"] .cell.on { background: var(--danger); }
.foe { display: flex; align-items: center; gap: 12px; font: 700 13px/1 var(--font-mono); }
.foe-label { color: var(--danger); max-width: 40%; overflow-wrap: anywhere; line-height: 1.3; }
.cell.foe-on { background: var(--danger); }
.inv { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.inv-label { font: 700 13px/1 var(--font-mono); color: var(--muted); letter-spacing: .08em; margin-right: 4px; }
.chip { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.none { color: var(--muted); }

/* 로그 */
.log { display: grid; gap: 18px; }
.entry { display: grid; gap: 8px; }
.you { margin: 0; justify-self: end; max-width: 90%; padding: 6px 14px; border-radius: 14px 14px 2px 14px; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.story { margin: 0; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px 14px 14px 14px; max-width: 65ch; overflow-wrap: anywhere; }
.intro p { margin: 0 0 10px; max-width: 65ch; }
.intro p:last-child { margin: 0; }
.stage { font: 700 12px/1 var(--font-mono); color: var(--muted); letter-spacing: .1em; }
.boss { margin: 0; overflow-x: auto; font: 700 clamp(11px, 3.4vw, 15px)/1.15 var(--font-mono); color: var(--accent); white-space: pre; }
.boss.angry, .boss.attack, .boss.hit { color: var(--danger); }
.boss.defeat { color: var(--muted); }

/* 컨트롤 */
.choices { display: grid; gap: 8px; }
button { font: inherit; cursor: pointer; }
.choice {
  display: flex; gap: 12px; align-items: baseline; text-align: left;
  padding: 11px 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice b { font: 700 13px/1 var(--font-mono); color: var(--accent); flex: none; }
.primary {
  justify-self: start; padding: 11px 22px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
}
button:disabled { opacity: .5; cursor: default; }
:is(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.free { display: flex; gap: 8px; }
.free input {
  flex: 1; min-width: 0; padding: 10px 14px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.free button { padding: 10px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 500; }
.status { min-height: 1.7em; margin: 0; font-size: 14px; color: var(--muted); }
.status.err { color: var(--danger); }
.end { padding: 18px; border: 1px dashed var(--accent); border-radius: 10px; display: grid; gap: 10px; }
.end h2 { margin: 0; font: 400 26px/1.2 var(--font-display); }
@media (prefers-reduced-motion: no-preference) {
  .entry { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  #glow.shift { animation: glowin .9s ease-out; }
  @keyframes glowin { from { opacity: 0; } }
  .cursor::after { animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hud.hit, .foe.hit, .boss.hit, .boss.attack { animation: shake .45s; }
  .boss.defeat { animation: melt 1.4s ease-out; }
  @keyframes melt { from { transform: scaleY(1.2) translateY(-8px); opacity: .35; } }
  @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  #flash.hit { animation: flashhit .55s ease-out; }
  @keyframes flashhit { from { box-shadow: inset 0 0 110px 14px rgba(220, 40, 30, .6); } to { box-shadow: inset 0 0 0 0 rgba(220, 40, 30, 0); } }
  #flash.heal { animation: flashheal .7s ease-out; }
  @keyframes flashheal { from { box-shadow: inset 0 0 110px 14px rgba(70, 200, 90, .45); } to { box-shadow: inset 0 0 0 0 rgba(70, 200, 90, 0); } }
  .chip.new { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); border-color: var(--accent); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
}
</style>

<div id="glow" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<main>
  <header class="sign">
    <div class="badge" aria-hidden="true">7</div>
    <div>
      <h1>부천 던전</h1>
      <p class="sub">야근 슬라임 왕을 쓰러뜨리고 칼퇴하세요 · 게임 마스터는 Claude</p>
    </div>
  </header>

  <section class="hud" id="hud" data-low="false" aria-label="상태">
    <div class="hp"><span class="hp-label">HP</span><div class="cells" id="cells"></div><span id="hpnum">10/10</span></div>
    <div class="inv"><span class="inv-label">가방</span><span id="inv" class="none">비어 있음</span></div>
    <div class="foe" id="foe" hidden><span class="foe-label" id="foename"></span><div class="cells" id="foecells"></div><span id="foenum"></span></div>
  </section>

  <section class="log" id="log" aria-live="polite">
    <div class="entry intro" id="intro">
      <div class="story">
        <p>밤 11시 47분, 부천역. 마지막 전철이 떠난 뒤 지하상가 셔터가 저절로 올라갑니다.</p>
        <p>만화박물관 벽의 캐릭터들이 꿈틀대고, 스타필드 쪽 하늘이 보라색으로 물듭니다. 도시 어딘가에서 이런 소리가 들립니다. "보고서... 아직 안 올렸지?"</p>
        <p>던전을 돌파해 야근 슬라임 왕을 쓰러뜨려야 퇴근할 수 있습니다.</p>
      </div>
    </div>
  </section>

  <p class="status" id="status" role="status"></p>

  <section id="controls">
    <button class="primary" id="start" type="button">모험 시작하기</button>
  </section>
</main>

<script>
const MAX_HP = 10;
const SYSTEM = `You are the game master of "Bucheon Dungeon", a text adventure.
Setting: Bucheon, South Korea, at midnight. A dungeon has opened, linking Bucheon Comics Museum, Jungdong Starfield, Sangdong Lake Park and the Bucheon Station underground mall. The player must defeat the city's ruler, the "Overtime Slime King", to escape. Tone: humorous and slightly absurd.

Output language: write every player-facing string (stage, story, choices, inventory items, enemy name) in natural, fluent Korean. Never put English in those fields. The Slime King's name is always "야근 슬라임 왕".
Each player message ends with a state tag like (턴 3, 현재 hp=8, inventory=[...], enemy={...}), where 턴 means the turn number.

Rules:
- story: exactly 2 sentences, at most 100 characters including spaces. Present tense. Show one vivid scene (what is seen, heard, felt) and do not explain. Make the last sentence a short tension-raising line (a line of dialogue or a sound). Do not repeat motifs or summarize the plot.
- choices: exactly 3, each at most 20 characters, written as actions. Make them differ in style (bold / cautious / silly).
- If the player types a free-form action instead of picking a choice, reflect that action.
- hp is between 0 and ${MAX_HP}. It drops when the player is in danger and can rise through healing items or rest.
- Keep only meaningful items in inventory. Continue from the state given at the end of each player message.
- Narration and state must agree. Items the player picks up are added to inventory that turn; items used or lost are removed. If the narration shows damage or healing, change hp accordingly.
- In the boss fight, reckless play costs the player 3-5 hp, and at 0 hp end at once with a defeat scene. Smart play with suitable items ends in victory.
- While fighting, set enemy to {"name", "hp", "max_hp"}; otherwise null. Minions have max_hp 3-5; the Slime King has max_hp 12. A successful player attack lowers enemy hp by 1-4, more with a fitting item. Narration and enemy hp must agree. A minion at 0 hp is defeated; move on to the next scene. The previous enemy state is given in the state tag; continue from it.
- Follow the turn number. Turns 1-4 are exploration: visit one location per turn, collect items and clues. The Slime King does not appear in person in this phase, only minions or traps. From turn 5 the final battle with the Slime King begins, and it ends by turn 10.
- stage: short name of the current location, e.g. "부천역 지하상가", "만화박물관", "스타필드", "호수공원".
- Start every scene with a new place or event, and open it with one sensory detail (sound, smell, light).
- status: "lose" if hp is 0, "win" if the Slime King's hp reaches 0, otherwise "playing".

Respond with exactly one JSON object and nothing else:
{"stage": "...", "story": "...", "choices": ["...", "...", "..."],
 "hp": number, "inventory": ["..."], "enemy": null or {"name": "...", "hp": number, "max_hp": number},
 "status": "playing|win|lose"}`;

const $ = (id) => document.getElementById(id);
let history = [];
let turn = 0;
let hp = MAX_HP;
let inventory = [];
let busy = false;
let currentHue = 90;
let enemy = null;
let shownItems = new Set();
let skipTyping = false;
// 장소 이름에 맞춘 배경 색조(hue). 앞에 있는 항목이 우선한다.
const SCENES = [["슬라임 왕", 100], ["만화박물관", 285], ["스타필드", 205], ["호수공원", 165], ["지하상가", 38], ["부천역", 38]];
document.addEventListener("click", () => { skipTyping = true; });

function renderHud() {
  const cells = $("cells");
  cells.replaceChildren();
  for (let i = 0; i < MAX_HP; i++) {
    const c = document.createElement("span");
    c.className = "cell" + (i < hp ? " on" : "");
    cells.append(c);
  }
  $("hpnum").textContent = hp + "/" + MAX_HP;
  $("hud").dataset.low = String(hp <= 3);
  const inv = $("inv");
  inv.replaceChildren();
  if (!inventory.length) { inv.className = "none"; inv.textContent = "비어 있음"; return; }
  inv.className = "";
  inventory.forEach((name) => {
    const s = document.createElement("span");
    s.className = "chip" + (shownItems.has(name) ? "" : " new"); s.textContent = name; inv.append(s);
  });
  shownItems = new Set(inventory);
}

function setStatus(msg, isErr) {
  const el = $("status");
  el.textContent = msg || "";
  el.className = "status" + (isErr ? " err" : "");
}

function parseTurn(text) {
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b < 0) throw new Error("bad-json");
  const t = JSON.parse(text.slice(a, b + 1));
  if (typeof t.story !== "string" || !Array.isArray(t.choices)) throw new Error("bad-json");
  return t;
}

async function askGM() {
  const sample = await window.claude?.use?.("sample");
  if (!sample) throw { code: "unavailable" };
  let lastErr;
  for (let i = 0; i < 2; i++) {
    const res = await sample(history, { cache: false, modelTier: "quick" });
    try { return parseTurn(res.text); } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function addEntry(youText, t, art) {
  const log = $("log");
  const entry = document.createElement("div");
  entry.className = "entry";
  if (youText) {
    const y = document.createElement("p"); y.className = "you"; y.textContent = youText; entry.append(y);
  }
  if (t.stage) {
    const s = document.createElement("div"); s.className = "stage"; s.textContent = "▸ " + t.stage; entry.append(s);
  }
  if (art) {
    const pre = document.createElement("pre"); pre.className = "boss " + art; pre.setAttribute("aria-hidden", "true");
    pre.textContent = BOSS[art]; entry.append(pre);
  }
  const st = document.createElement("p"); st.className = "story"; entry.append(st);
  log.append(entry);
  entry.scrollIntoView({ block: "nearest", behavior: "smooth" });
  return st;
}

// 글자가 한 글자씩 나오는 타자 효과. 화면을 클릭하면 바로 끝까지 표시한다.
function typeText(el, text) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; return Promise.resolve(); }
  skipTyping = false;
  el.classList.add("cursor");
  return new Promise((resolve) => {
    let i = 0;
    const tick = () => {
      i = skipTyping ? text.length : i + 1;
      el.textContent = text.slice(0, i);
      if (i >= text.length) { el.classList.remove("cursor"); resolve(); return; }
      setTimeout(tick, ".,!?…".includes(text[i - 1]) ? 220 : 28);
    };
    tick();
  });
}

// 응답의 enemy를 {name, hp, max_hp}로 정리한다. 전투 중이 아니면 null.
function normEnemy(e) {
  if (!e || typeof e !== "object" || !e.name) return null;
  const max = Math.max(1, Math.round(Number(e.max_hp)) || 1);
  const raw = Math.round(Number(e.hp));
  return { name: String(e.name), max, hp: Number.isNaN(raw) ? max : Math.max(0, Math.min(max, raw)) };
}

function renderEnemy(prev) {
  const box = $("foe");
  box.hidden = !enemy;
  if (!enemy) return;
  $("foename").textContent = "적 " + enemy.name;
  $("foenum").textContent = enemy.hp + "/" + enemy.max;
  const cells = $("foecells");
  cells.replaceChildren();
  for (let i = 0; i < enemy.max; i++) {
    const c = document.createElement("span");
    c.className = "cell" + (i < enemy.hp ? " foe-on" : "");
    cells.append(c);
  }
  if (prev && prev.name === enemy.name && enemy.hp < prev.hp) pulse("foe", "hit");
}

// 슬라임 왕 아스키아트: 상태별로 미리 그려 둔 그림을 고른다 (모델이 그리지 않는다)
const BOSS = {
  idle: String.raw`
      .  ^ ^ ^  .
      |_|_|_|_|_|
    .-'~~~~~~~~~'-.
   /   (O)   (O)   \
  |        __       |
  |       \__/      |
   \               /
    '-._________.-'`.slice(1),
  hit: String.raw`
      .  ^ ^ ^  .
      |_|_|_|_|_|
    .-'~~~~~~~~~'-.
   / ,  (X)   (X) , \
  |   !!   ____   !! |
  |       \____/     |
   \_             _/
  ~~'-._________.-'~~`.slice(1),
  angry: String.raw`
    # .  ^ ^ ^  . #
      |_|_|_|_|_|
    .-'~~~~~~~~~'-.
   /   (>)   (<)   \
  |    /VVVVVVV\    |
  |    \_______/    |
   \               /
    '-._________.-'`.slice(1),
  attack: String.raw`
      .  ^ ^ ^  .
      |_|_|_|_|_|
    .-'~~~~~~~~~'-.
   /   (@)   (@)   \
  |   .-----------. |
  |   |  GRAAAH!  | |
   \  '-----------' /
    '-._________.-'`.slice(1),
  defeat: String.raw`
        _^^^_
       (_____)
   ~  ~  ~ ~  ~  ~  ~
  ( ~~  (x)    (x)  ~~ )
   '~~~~~~~~~~~~~~~~~~'`.slice(1),
};
const isKing = (e) => !!e && e.name.includes("슬라임 왕");

function bossKey(t, prevHp, prevEnemy) {
  if (t.status === "win" && (isKing(enemy) || isKing(prevEnemy))) return "defeat";
  if (!isKing(enemy)) return null;
  if (enemy.hp === 0) return "defeat";
  if (hp < prevHp) return "attack";
  if (isKing(prevEnemy) && enemy.hp < prevEnemy.hp) return "hit";
  return enemy.hp / enemy.max <= 0.4 ? "angry" : "idle";
}

function pulse(id, cls) {
  const el = $(id);
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 800);
}

function setScene(t) {
  let hue = currentHue;
  if (t.status === "win") hue = 48;
  else if (t.status === "lose" || hp === 0) hue = 0;
  else {
    const found = [t.stage || "", t.story].map((text) => SCENES.find(([k]) => text.includes(k))).find(Boolean);
    if (found) hue = found[1];
  }
  if (hue === currentHue) return;
  currentHue = hue;
  document.documentElement.style.setProperty("--hue", String(hue));
  pulse("glow", "shift");
}

function errorMessage(e) {
  if (e && e.code === "not_granted") return "Claude 사용을 허용해야 게임을 진행할 수 있어요. 다시 눌러 허용해 주세요.";
  if (e && e.code === "rate_limited") return "요청이 많아요. 잠시 후 다시 시도해 주세요.";
  if (e && e.code === "unavailable") return "이 화면에서는 Claude 연동을 쓸 수 없어요. claude.ai에서 열어 주세요.";
  return "Claude의 응답을 해석하지 못했어요. 한 번 더 눌러 주세요.";
}

function renderControls(t) {
  const box = $("controls");
  box.replaceChildren();
  if (t.status === "win" || t.status === "lose" || hp === 0) {
    const win = t.status === "win";
    const end = document.createElement("div"); end.className = "end";
    const h = document.createElement("h2"); h.textContent = win ? "CLEAR · 칼퇴 성공" : "GAME OVER · 야근 확정";
    const p = document.createElement("p"); p.style.margin = "0";
    p.textContent = win ? "부천에 평화와 정시 퇴근이 돌아왔습니다." : "야근의 늪에 빠졌습니다. 내일 다시 출근하세요.";
    const b = document.createElement("button"); b.className = "primary"; b.type = "button"; b.textContent = "다시 시작"; b.onclick = startGame;
    end.append(h, p, b); box.append(end);
    return;
  }
  const list = document.createElement("div"); list.className = "choices";
  t.choices.slice(0, 3).forEach((c, i) => {
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "choice";
    const n = document.createElement("b"); n.textContent = String(i + 1);
    const label = document.createElement("span"); label.textContent = c;
    btn.append(n, label);
    btn.onclick = () => act(c);
    list.append(btn);
  });
  const form = document.createElement("form"); form.className = "free";
  const input = document.createElement("input");
  input.id = "free-input"; input.type = "text"; input.placeholder = "직접 행동 입력 (예: 슬라임에게 커피를 건넨다)"; input.maxLength = 120;
  const send = document.createElement("button"); send.type = "submit"; send.textContent = "실행";
  form.append(input, send);
  form.onsubmit = (ev) => { ev.preventDefault(); const v = input.value.trim(); if (v) act(v); };
  box.append(list, form);
}

function setBusy(on) {
  busy = on;
  $("controls").querySelectorAll("button, input").forEach((el) => { el.disabled = on; });
  if (on) setStatus("게임 마스터가 다음 장면을 쓰는 중…");
}

async function step(userText, youText) {
  if (busy) return;
  history.push({ role: "user", content: userText });
  setBusy(true);
  try {
    const t = await askGM();
    history.push({ role: "assistant", content: JSON.stringify(t) });
    const prevHp = hp;
    const prevEnemy = enemy;
    enemy = normEnemy(t.enemy);
    hp = Math.max(0, Math.min(MAX_HP, Math.round(Number(t.hp))));
    if (Number.isNaN(hp)) hp = MAX_HP;
    inventory = Array.isArray(t.inventory) ? t.inventory.map(String) : [];
    turn += 1;
    busy = false;
    setStatus("");
    setScene(t);
    renderHud();
    renderEnemy(prevEnemy);
    if (hp < prevHp) { pulse("hud", "hit"); pulse("flash", "hit"); }
    else if (hp > prevHp) pulse("flash", "heal");
    const st = addEntry(youText, t, bossKey(t, prevHp, prevEnemy));
    await typeText(st, t.story);
    renderControls(t);
    $("controls").scrollIntoView({ block: "nearest", behavior: "smooth" });
  } catch (e) {
    history.pop();
    setStatus(errorMessage(e), true);
    setBusy(false);
  }
}

function act(choice) {
  const state = "(턴 " + (turn + 1) + ", 현재 hp=" + hp + ", inventory=" + JSON.stringify(inventory) + ", enemy=" + JSON.stringify(enemy) + ")";
  step(choice + " " + state, choice);
}

function startGame() {
  history = []; turn = 0; hp = MAX_HP; inventory = []; shownItems = new Set();
  enemy = null; $("foe").hidden = true;
  currentHue = 90; document.documentElement.style.setProperty("--hue", "90");
  $("log").querySelectorAll(".entry:not(#intro)").forEach((n) => n.remove());
  renderHud();
  step(SYSTEM + "\n\n게임을 시작해줘. 첫 장면을 보여줘. hp는 " + MAX_HP + ", inventory는 비어 있어. (턴 1)", null);
}

$("start").onclick = startGame;
renderHud();
</script>
